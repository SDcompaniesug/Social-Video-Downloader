name: Build Neon Function Bundle

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/index.mjs"
      - "backend/package.json"
      - ".github/workflows/neon-function-bundle.yml"

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Bundle runtime dependencies
        working-directory: backend
        run: |
          mkdir -p dist
          npx --yes esbuild@0.25.11 index.mjs --bundle --platform=node --target=node24 --format=esm --packages=bundle --external:pg-native --minify --outfile=dist/index.mjs
          printf '{"name":"social-videos-function","private":true,"type":"module"}\n' > dist/package.json
          cd dist
          zip -9 -q -X ../socialvideos-function.zip index.mjs package.json
          cd ..
          base64 -w0 socialvideos-function.zip > socialvideos-function.zip.b64
      - name: Publish temporary deployment bundle
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Build temporary Neon Function bundle"
          file_pattern: "backend/socialvideos-function.zip.b64"
